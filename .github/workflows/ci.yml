name: CI

# Gate every push and PR on the same checks we run locally: TypeScript must compile and the full
# Jest suite (logic + ui projects) must pass. No native build here — that's EAS (see eas.json).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Jest (all projects)
        run: npm test -- --ci --runInBand
