name: CI

# Gate every push and PR on the same checks we run locally: TypeScript must compile and the full
# Jest suite (logic + ui projects) must pass. No native build here — that's EAS (see eas.json).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Jest (all projects)
        run: npm test -- --ci --runInBand

  quality-gate:
    name: quality gate (UI change must ship with a test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history so the gate can diff against main
      - name: Fetch main
        run: git fetch origin main:refs/remotes/origin/main || true
      - name: A change to src/screens or src/components must come with a test
        run: bash scripts/check-ui-tests.sh origin/main

  rules:
    name: firestore rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4   # Firestore emulator needs a JDK (current emulator requires Java 21+)
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Firestore security-rules tests
        run: npm run test:rules
