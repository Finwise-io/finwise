<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinWise — Your Personal Finance Companion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1f3a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .logo { width: 100px; height: 100px; background: #222b52; border-radius: 22px; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: 800; color: #fff; margin: 0 auto 24px; border-bottom: 6px solid #00c878; }
    h1 { font-size: 2rem; font-weight: 800; margin-bottom: 12px; }
    p { color: rgba(255,255,255,0.7); font-size: 1.1rem; margin-bottom: 40px; line-height: 1.6; max-width: 480px; }
    .links { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    a { color: #00c878; text-decoration: none; font-weight: 600; font-size: 0.95rem; padding: 10px 20px; border: 1.5px solid #00c878; border-radius: 100px; transition: background 0.2s; }
    a:hover { background: rgba(0,200,120,0.15); }
  </style>
</head>
<body>
  <div class="logo">FW</div>
  <h1>FinWise</h1>
  <p>Your personal finance companion. Budget smarter, save more, and plan for the future — all in one place.</p>
  <div class="links">
    <a href="/finwise/privacy/">Privacy Policy</a>
    <a href="/finwise/terms/">Terms of Service</a>
  </div>
</body>
</html>
