# THE CASH FLOW TAB, AS IT IS BUILT TODAY (rewritten 2026-11-08, design review): the old flow asserted "Cash-flow detail",
# "A TYPICAL MONTH" and "TAKE-HOME vs SPENDING", which no longer exist, so it could never pass. The tab is reached from the
# tab bar; This month shows PLANNED and ACTUAL · SO FAR, and the four tabs open.
#
# Run: maestro test .maestro/cashflow.yaml   (needs a booted simulator with the app + a seeded profile)
appId: co.finwise.app
---
- launchApp:
    clearState: false
- openLink: finwise://home
- extendedWaitUntil:
    visible: "Cash flow"
    timeout: 45000
- tapOn: "Cash flow"
- extendedWaitUntil:
    visible:
      text: "PLANNED · .*"
    timeout: 15000
- assertVisible: "ACTUAL · SO FAR"
- tapOn: "Income"
- tapOn: "Expenses"
- tapOn: "Debts"
- tapOn: "This month"
- assertVisible:
    text: "PLANNED · .*"
